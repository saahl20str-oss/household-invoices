const nm=m=>{const d=new Date(m+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+1);return d.toISOString().slice(0,10)};
function calc(w){const inv=S.inv.filter(i=>i.worker_id==w);const due=sum(inv.filter(i=>i.pay_source=='own'&&['approved','paid'].includes(i.status)).map(i=>i.amount));
 const paid=sum(S.pay.filter(p=>p.worker_id==w).map(p=>p.amount));return{inv,due,paid,left:Math.max(0,due-paid),tot:sum(inv.map(i=>i.amount))}}
async function dash(){try{await dash0()}catch(e){page(`<main><div class="n">${esc(e.message||e)}</div><button class="b" onclick="dash()">${t('refresh')}</button></main>`)}}
async function dash0(){S.start=S.month+'-01';S.end=nm(S.month);
 const[w,i,p,n,h]=await Promise.all([sb.from('hh_workers').select('*').order('created_at'),
 sb.from('hh_invoices').select('id,worker_id,store,amount,inv_date,pay_source,status,owner_note').gte('inv_date',S.start).lt('inv_date',S.end).order('inv_date',{ascending:false}),
 sb.from('hh_payments').select('*').eq('month',S.month),sb.from('hh_invoices').select('worker_id,inv_date').eq('status','pending'),sb.from('hh_homes').select('name,join_code').limit(1)]);
 const er=[w,i,p,n].find(r=>r.error);if(er)throw new Error(er.error.message);
 S.w=w.data||[];S.inv=i.data||[];S.pay=p.data||[];const H=(h.data&&h.data[0])||{};S.hname=H.name||'';S.join=H.join_code||'';S.pn={};(n.data||[]).forEach(r=>S.pn[r.worker_id]=(S.pn[r.worker_id]||0)+1);S.pm=((n.data||[]).map(r=>r.inv_date).sort().pop()||'').slice(0,7);
 const P=sum(Object.values(S.pn));if(S.lp!=null&&P>S.lp)toast(t('newbn'));S.lp=P;view()}
function view(){S.re=view;({dash:list,detail,add:addv,set:setv})[S.v]()}
const mi=()=>`<input type="month" value="${S.month}" onchange="S.month=this.value;dash()">`;
const sm=cs=>`<div class="grid"><div class="card"><div class="m">${t('total')}</div><div class="big">${money(sum(S.inv.map(x=>x.amount)))}</div></div>
 <div class="card"><div class="m">${t('paid')}</div><div class="big">${money(sum(S.pay.map(x=>x.amount)))}</div></div>
 <div class="card"><div class="m">${t('due')}</div><div class="big">${money(sum(cs.map(c=>c.left)))}</div></div>
 <div class="card"><div class="m">${t('pend')}</div><div class="big">${sum(Object.values(S.pn))}</div></div></div>`;
const back=()=>`<button onclick="S.v='dash';view()">${L=='ar'?'→':'←'} ${t('back')}</button>`;
const invCard=(i,sn)=>{const n=S.w.findIndex(x=>x.id==i.worker_id);return`<div class="card" style="--c:${COL[Math.max(n,0)%6]}"><div class="r"><b>${money(i.amount)}</b><span class="s ${i.status}">${t('s_'+i.status)}</span></div>
 <div class="m">${sn&&S.w[n]?`<b>${esc(S.w[n].name)}</b> · `:''}${esc(i.store||'')} · ${i.inv_date} · ${t(i.pay_source)}</div>${i.owner_note?`<div class="n">${esc(i.owner_note)}</div>`:''}
 <button onclick="show('${i.id}')">${t('img')}</button>${i.status=='pending'?`<button onclick="rv('${i.id}','approved')">${t('appr')}</button><button onclick="rv('${i.id}','revision')">${t('rev')}</button>`:''}${i.status!='paid'?`<button class="x" onclick="deli('${i.id}')">${t('del')}</button>`:''}</div>`};
function list(){const cs=S.w.map(x=>calc(x.id)),P=sum(Object.values(S.pn)),IN=S.w.filter(x=>!x.active).length,
 jc=S.join?`<div class="card"><p class="m">${t('joinD')}</p><button style="width:100%" onclick="cp('${location.origin+location.pathname}?j=${S.join}')">${t('joinLink')}</button></div>`:'';
 const f=S.inv.filter(i=>(!S.fw||i.worker_id==S.fw)&&(!S.fs||i.status==S.fs));
 const body=S.tab=='inv'?`<div class="grid"><select onchange="S.fw=this.value;view()"><option value="">${t('tHelp')}: ${t('all')}</option>${S.w.map(x=>`<option value="${x.id}" ${S.fw==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <select onchange="S.fs=this.value;view()"><option value="">${t('all')}</option>${['pending','approved','revision','paid'].map(s=>`<option value="${s}" ${S.fs==s?'selected':''}>${t('s_'+s)}</option>`).join('')}</select></div>${f.map(i=>invCard(i,1)).join('')||`<p class="m">${t('noinv')}</p>`}`
 :jc+S.w.map((x,n)=>{const c=cs[n],p=S.pn[x.id]||0;return`<div class="card r" style="--c:${COL[n%6]};cursor:pointer;position:relative" onclick="S.open='${x.id}';S.v='detail';view();scrollTo(0,0)"><b>${esc(x.name)}</b>
 <span>${x.active?'':`<span class="s">${t('inact')}</span> `}${p?`<span class="s pending">${t('newinv')} (${p})</span>`:''}${c.due>0&&c.left<=0?` <span class="ok">${t('settled')}</span>`:''}</span><span class="kb" aria-label="menu" onclick="event.stopPropagation();km('${x.id}')">&#8942;</span><div class="menu" id="m${x.id}" onclick="event.stopPropagation()"><button onclick="cpw('${x.id}')">${t('link')}</button><button onclick="renew('${x.id}')">${t('renew')}</button><button onclick="tog('${x.id}',${!x.active})">${x.active?t('stop'):t('resume')}</button><button onclick="pay('${x.id}')">${t('pay')}</button><button class="x" onclick="delw('${x.id}')">${t('del')}</button></div></div>`}).join('');
 page(`<main><div class="r"><h3 style="margin:6px 0">${esc(S.hname||t('app'))}</h3><span><button class="b" style="width:auto" onclick="S.v='add';view()">${t('addh')}</button> <button onclick="S.v='set';view()">${t('sett')}</button></span></div>
 ${P?`<div class="n" style="cursor:pointer" onclick="goPend()">${t('newbn')} (${P})</div>`:''}${IN?`<div class="n">${t('inactN')} (${IN})</div>`:''}${mi()}${sm(cs)}
 <div class="r" style="margin:10px 0"><button class="tab ${S.tab=='inv'?'on':''}" onclick="S.tab='inv';view()">${t('tInv')}</button><button class="tab ${S.tab=='help'?'on':''}" onclick="S.tab='help';view()">${t('tHelp')}${P?` (${P})`:''}</button></div>${body}</main>`)}
function detail(){const n=S.w.findIndex(x=>x.id==S.open),x=S.w[n];if(!x){S.v='dash';return list()}
 const c=calc(x.id),base=location.origin+location.pathname;
 page(`<main>${back()}${mi()}<div class="card" style="--c:${COL[n%6]}"><div class="r"><b>${esc(x.name)}</b>${c.due>0&&c.left<=0?`<span class="ok">${t('settled')}</span>`:''}</div>
 <div class="m">${x.phone?esc(x.phone)+' · ':''}${t('count')}: ${c.inv.length} · ${t('total')}: ${money(c.tot)} · ${t('left')}: ${money(c.left)}</div>${x.note?`<div class="m">${esc(x.note)}</div>`:''}
 <button onclick="pay('${x.id}')">${t('pay')}</button> <button onclick="cp('${base}?w=${x.token}')">${t('link')}</button> <button onclick="renew('${x.id}')">${t('renew')}</button>
 <button onclick="tog('${x.id}',${!x.active})">${x.active?t('stop'):t('resume')}</button> <button class="x" onclick="delw('${x.id}')">${t('del')}</button></div>
 ${c.inv.map(i=>invCard(i,0)).join('')||`<p class="m">${t('noinv')}</p>`}</main>`)}
function addv(){page(`<main>${back()}<div class="card"><h3>${t('addh')}</h3><input id="wn" placeholder="${t('name')}"><input id="wp" placeholder="${t('phone')}"><input id="wo" placeholder="${t('note')}"><button class="b" onclick="addw()">${t('save')}</button></div></main>`)}
function setv(){page(`<main>${back()}<h3>${t('sett')}</h3>
 <div class="card"><b>${t('sName')}</b><input id="hn2" value="${esc(S.hname)}"><button onclick="savehn()">${t('save')}</button></div>
 <div class="card"><b>${t('sSettle')}</b> (${S.month})<p class="m">${t('sSettleD')}</p><button class="b" onclick="settle()">${t('sSettle')}</button></div>
 <div class="card"><button style="width:100%" onclick="csv()">${t('sCsv')}</button></div>
 <div class="card"><b>${t('sPw')}</b><input id="np" type="password" placeholder="${t('sPw2')}"><button class="b" onclick="chpw()">${t('sPw')}</button><button style="width:100%" onclick="reset()">${t('sReset')}</button></div>
 <div class="card"><b>${t('joinLink')}</b><p class="m">${t('joinD')}</p><button style="width:100%" onclick="renewJ()">${t('renewJ')}</button></div>
 <div class="card"><button class="x" style="width:100%" onclick="logout()">${t('logout')}</button></div></main>`)}
const cp=async u=>{try{await navigator.clipboard.writeText(u)}catch(e){prompt('',u)}alert(t('copied'))};
const addw=()=>once(async()=>{const n=$('#wn').value.trim();if(!n)return;const{error}=await sb.from('hh_workers').insert({home_id:S.home,name:n,phone:$('#wp').value,note:$('#wo').value,token:rt()});if(error)return alert(error.message);S.v='dash';S.tab='help';await dash()});
const renew=id=>once(async()=>{await sb.from('hh_workers').update({token:rt()}).eq('id',id);dash()});
const tog=(id,a)=>once(async()=>{await sb.from('hh_workers').update({active:a}).eq('id',id);dash()});
const delw=id=>once(async()=>{if(!confirm(t('delq')))return;await sb.from('hh_payments').delete().eq('worker_id',id);await sb.from('hh_invoices').delete().eq('worker_id',id);
 const{error}=await sb.from('hh_workers').delete().eq('id',id);if(error)return alert(error.message);S.open=null;S.v='dash';S.tab='help';dash()});
const rv=(id,s)=>once(async()=>{let n=null;if(s=='revision'){n=prompt(t('onote'));if(n===null)return}await sb.from('hh_invoices').update({status:s,owner_note:n}).eq('id',id);dash()});
async function show(id){const{data}=await sb.from('hh_invoices').select('image').eq('id',id).single();if(!data||!data.image)return alert(t('noimg'));$('#oi').src=data.image;$('#ov').style.display='flex'}
const pay=wid=>once(async()=>{const r=calc(wid).left;if(r<=0)return alert(t('settled'));const a=+prompt(t('payq')+' — '+t('left')+': '+r.toFixed(2),r.toFixed(2));if(!(a>0))return;if(a>r+0.005)return alert(t('over'));
 const mt=prompt(t('method'),'')||'';const{error}=await sb.from('hh_payments').insert({home_id:S.home,worker_id:wid,month:S.month,amount:a,method:mt,paid_at:today()});if(error)return alert(error.message);
 if(a>=r-0.005)await sb.from('hh_invoices').update({status:'paid'}).eq('worker_id',wid).eq('status','approved').eq('pay_source','own').gte('inv_date',S.start).lt('inv_date',S.end);dash()});
const settle=()=>once(async()=>{const rows=S.w.map(x=>({x,c:calc(x.id)})).filter(r=>r.c.left>0.005);if(!rows.length)return alert(t('nothing'));const tot=sum(rows.map(r=>r.c.left));
 if(!confirm(t('sSettleQ')+'\n'+rows.map(r=>r.x.name+': '+money(r.c.left)).join('\n')+'\n'+t('total')+': '+money(tot)))return;
 let e=(await sb.from('hh_payments').insert(rows.map(r=>({home_id:S.home,worker_id:r.x.id,month:S.month,amount:r.c.left,method:'settlement',paid_at:today()})))).error;if(e)return alert(e.message);
 e=(await sb.from('hh_invoices').update({status:'paid'}).eq('status','approved').eq('pay_source','own').gte('inv_date',S.start).lt('inv_date',S.end)).error;if(e)return alert(e.message);
 alert(t('done')+': '+money(tot));S.v='dash';S.tab='help';dash()});
const savehn=()=>once(async()=>{const v=$('#hn2').value.trim();await sb.from('hh_homes').update({name:v}).eq('id',S.home);S.hname=v;alert(t('done'))});
const chpw=()=>once(async()=>{const p=$('#np').value;if(p.length<6)return alert(t('sPw2'));const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:t('done'))});
const reset=()=>once(async()=>{const{data:{user}}=await sb.auth.getUser();const{error}=await sb.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+location.pathname});alert(error?error.message:t('done'))});
function csv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',wn=id=>(S.w.find(x=>x.id==id)||{}).name||'';
 const rows=[['Helper','Date','Store','Amount','Paid with','Status'],...S.inv.map(i=>[wn(i.worker_id),i.inv_date,i.store,i.amount,i.pay_source,i.status]),[],['Payments','Date','Method','Amount'],...S.pay.map(p=>[wn(p.worker_id),p.paid_at,p.method,p.amount])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='statement-'+S.month+'.csv';a.click()}
const em=m=>/too_many/.test(m)?t('e_many'):/bad_date/.test(m)?t('e_date'):/bad_amount/.test(m)?t('e_amt'):/bad_code/.test(m)?t('badcode'):m;
const km=id=>{const m=document.getElementById('m'+id),on=m.classList.contains('on');document.querySelectorAll('.menu.on').forEach(e=>e.classList.remove('on'));if(!on)m.classList.add('on')};
document.addEventListener('click',()=>document.querySelectorAll('.menu.on').forEach(e=>e.classList.remove('on')));
const cpw=id=>cp(location.origin+location.pathname+'?w='+S.w.find(x=>x.id==id).token);
const goPend=()=>{if(S.pm)S.month=S.pm;S.tab='inv';S.fs='pending';S.fw='';S.v='dash';dash()};
const deli=id=>once(async()=>{if(!confirm(t('delinv')))return;const{error}=await sb.from('hh_invoices').delete().eq('id',id);if(error)return alert(error.message);dash()});
const renewJ=()=>once(async()=>{if(!confirm(t('renewJq')))return;const c=rt().slice(0,12);const{error}=await sb.from('hh_homes').update({join_code:c}).eq('id',S.home);if(error)return alert(error.message);S.join=c;alert(t('done'))});
setInterval(()=>{if(S.home&&S.in&&['dash','detail'].includes(S.v)&&!S.busy&&!document.querySelector('.menu.on')&&!/INPUT|SELECT/.test(document.activeElement.tagName))dash()},30000);
document.documentElement.dir=L=='ar'?'rtl':'ltr';document.documentElement.lang=L;route();
</script>
</body>
</html>
